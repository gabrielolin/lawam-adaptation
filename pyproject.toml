[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawam-adaptation"
version = "0.1.0"
description = "Research adapters and experiments for LaWAM adaptation."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
