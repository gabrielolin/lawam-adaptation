name: lawam-adaptation
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.10
  - pip
  # FlashAttention is compiled locally. CUDA 12.8 has native Blackwell support.
  - cuda-nvcc=12.8
  - ninja
  - packaging
  - setuptools
  - wheel
  - pytest
  # LaWAM's Python requirements are installed by scripts/bootstrap_env.sh
  # after the CUDA 12.8 PyTorch runtime, so its older PyTorch pin cannot
  # replace the Blackwell-compatible build.
